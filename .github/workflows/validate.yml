name: PR validation

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-linux:
    name: Linux validation
    runs-on: ubuntu-latest
    env:
      ZZZOPS_EXPECT_INSTALLERS: PowerShell,Bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Install release tooling
        run: npm ci
      - name: Test ZzzOps core and repository contracts
        run: python .github/scripts/run_product_validation.py --platform linux

  validate-windows:
    name: Windows installer validation
    runs-on: windows-latest
    env:
      ZZZOPS_EXPECT_INSTALLERS: PowerShell,Bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native Windows installer behavior
        run: python .github/scripts/run_product_validation.py --platform windows

  validate-macos:
    name: macOS installer validation
    runs-on: macos-latest
    env:
      ZZZOPS_EXPECT_INSTALLERS: Bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native macOS installer behavior
        run: python .github/scripts/run_product_validation.py --platform macos

  required:
    name: dev-required-tests
    if: ${{ always() }}
    needs: [validate-linux, validate-windows, validate-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every native validation leg
        run: >-
          python .github/scripts/require_validation.py
          linux=${{ needs.validate-linux.result }}
          windows=${{ needs.validate-windows.result }}
          macos=${{ needs.validate-macos.result }}
