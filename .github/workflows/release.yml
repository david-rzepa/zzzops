name: Semantic release

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Install release tooling
        run: npm ci
      - name: Test semantic release configuration
        run: npm run test:release
      - name: Preview semantic release
        run: node .github/scripts/preview_semantic_release.mjs

  validate-linux:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Install release tooling
        run: npm ci
      - name: Run the shared Linux product-validation leg
        run: python .github/scripts/run_product_validation.py --platform linux

  validate-windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the shared Windows plugin validation leg
        run: python .github/scripts/run_product_validation.py --platform windows

  release:
    if: github.ref == 'refs/heads/main'
    needs: [validate-linux, validate-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Install release tooling
        run: npm ci
      - name: Test semantic release configuration
        run: npm run test:release
      - name: Publish semantic GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npx semantic-release
